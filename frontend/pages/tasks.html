<!-- Clear any stale mock localStorage tasks before JS initialises -->
<script>
  (function () {
    try {
      const raw = localStorage.getItem('taskpilot_tasks');
      if (raw) {
        const tasks = JSON.parse(raw);
        // If every stored task has an id starting with 'task-' it is the old mock seed—clear it.
        const allMock = Array.isArray(tasks) && tasks.length > 0 && tasks.every(t => String(t.id).startsWith('task-'));
        if (allMock) {
          localStorage.removeItem('taskpilot_tasks');
        }
      }
    } catch (_) {}
  })();
</script>
