<!DOCTYPE html>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased" style="background-color: #F7F7F2; color: #64748B;">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-lg overflow-hidden" style="background-color: #FFFFFF; border-color: #E5E7EB; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);">
<div class="p-lg md:p-xl flex flex-col items-center border-b border-outline-variant">
<div class="flex items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="task_alt" style="font-variation-settings: 'FILL' 1;">task_alt</span>
<span class="font-headline-md text-headline-md text-on-surface" style="color: #172033;">TaskPilotAI</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface text-center mb-unit" style="color: #172033;">Create your account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">Start organizing your tasks smarter with AI.</p>
</div>
<div class="p-lg md:p-xl space-y-md">
<form class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="fullName" style="color: #172033;">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="person">person</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="Enter your full name" style="background-color: #FFFFFF; border-color: #E5E7EB; color: #172033;" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="email" style="color: #172033;">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="Enter your email" style="background-color: #FFFFFF; border-color: #E5E7EB; color: #172033;" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="password" style="color: #172033;">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-10 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="Create a password" style="background-color: #FFFFFF; border-color: #E5E7EB; color: #172033;" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-unit">
<div class="flex gap-2 h-1.5 w-full">
<div class="flex-1 bg-error rounded-full h-full opacity-50"></div>
<div class="flex-1 bg-surface-container-high rounded-full h-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full h-full"></div>
</div>
<div class="flex justify-between font-label-md text-[10px] uppercase text-on-surface-variant tracking-wider">
<span class="text-error">Weak</span>
<span>Medium</span>
<span>Strong</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface block" for="confirmPassword" style="color: #172033;">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-3 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirmPassword" placeholder="Confirm your password" style="background-color: #FFFFFF; border-color: #E5E7EB; color: #172033;" type="password"/>
</div>
</div>
<div class="flex items-start gap-2 pt-sm">
<input class="mt-1 w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface cursor-pointer" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="terms">
                        I agree to the <a class="text-primary hover:underline underline-offset-2" href="#">Terms &amp; Conditions</a>
</label>
</div>
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" style="background-color: #166534; color: #FFFFFF;" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full bg-transparent border border-outline-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
                Continue with Google
            </button>
</div>
<div class="p-md border-t border-outline-variant bg-surface-container-high/50 text-center" style="background-color: #F9FAFB; border-color: #E5E7EB;">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? <a class="text-primary font-semibold hover:underline underline-offset-2" href="#">Login</a>
</p>
</div>
</div>
