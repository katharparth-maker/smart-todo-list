<style>
        .input-group:focus-within label {
            color: #172033;
        }
        .input-field {
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus {
            outline: none;
            border-color: #172033;
            box-shadow: 0 0 0 2px rgba(23, 32, 51, 0.1);
        }
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }

            transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-md md:p-lg flex flex-col gap-md">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-xs mb-sm">
<div class="flex items-center gap-base mb-xs">
<span class="material-symbols-outlined text-secondary text-[28px]" style="font-variation-settings: 'FILL' 1;">task_alt</span>
<h1 class="font-headline-md text-headline-md text-primary">TaskPilot AI</h1>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium tracking-wide uppercase">Plan. Focus. Achieve.</p>
</header>
<div class="text-center mb-sm">
<h2 class="font-headline-md text-headline-md text-primary-container mb-xs">Create your account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Start organizing your tasks smarter with AI.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" id="signupForm" novalidate="">
<div class="input-group flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="input-field w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded pl-10 pr-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
</div>
<div class="input-group flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="input-field w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded pl-10 pr-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<div class="input-group flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="input-field w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline" id="password" placeholder="Create a password" required="" type="password"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline password-toggle hover:text-on-surface-variant" onclick="togglePassword('password', this)">visibility_off</span>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-xs mt-xs">
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden flex gap-xs">
<div class="h-full w-1/3 bg-error strength-bar" id="strength-1"></div>
<div class="h-full w-1/3 bg-surface-container strength-bar" id="strength-2"></div>
<div class="h-full w-1/3 bg-surface-container strength-bar" id="strength-3"></div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[11px] leading-tight flex items-center justify-between">
<span>Use at least 8 characters, letters &amp; numbers.</span>
<span class="font-label-sm text-error" id="strength-text">Weak</span>
</p>
</div>
</div>
<div class="input-group flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant transition-colors" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock_clock</span>
<input class="input-field w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline" id="confirmPassword" placeholder="Confirm your password" required="" type="password"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline password-toggle hover:text-on-surface-variant" onclick="togglePassword('confirmPassword', this)">visibility_off</span>
</div>
</div>
<button class="w-full h-[44px] bg-secondary hover:bg-on-secondary-container text-on-secondary font-label-md text-label-md rounded flex items-center justify-center gap-xs transition-colors mt-xs relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center gap-xs">Create account <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span></span>
<!-- Loading State (Hidden by default) -->
<div class="absolute inset-0 bg-secondary flex items-center justify-center opacity-0 pointer-events-none group-[.is-loading]:opacity-100 transition-opacity">
<span class="material-symbols-outlined animate-spin">progress_activity</span>
</div>
</button>
</form>
<div class="flex items-center gap-sm my-xs">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">or continue with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<button class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-primary-container font-label-md text-label-md rounded flex items-center justify-center gap-sm transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<footer class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-label-sm text-secondary hover:text-on-secondary-container underline underline-offset-2 transition-colors" href="login.html">Login</a>
</p>
</footer>
</main>
<script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.textContent = 'visibility';
            } else {
                input.type = 'password';
                iconElement.textContent = 'visibility_off';
            }
        }

        // Basic Password Strength Simulation
        const passwordInput = document.getElementById('password');
        const s1 = document.getElementById('strength-1');
        const s2 = document.getElementById('strength-2');
        const s3 = document.getElementById('strength-3');
        const sText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            if (val.length === 0) {
                s1.className = 'h-full w-1/3 bg-error strength-bar';
                s2.className = 'h-full w-1/3 bg-surface-container strength-bar';
                s3.className = 'h-full w-1/3 bg-surface-container strength-bar';
                sText.textContent = 'Weak';
                sText.className = 'font-label-sm text-error';
            } else if (val.length < 8) {
                s1.className = 'h-full w-1/3 bg-error strength-bar';
                s2.className = 'h-full w-1/3 bg-surface-container strength-bar';
                s3.className = 'h-full w-1/3 bg-surface-container strength-bar';
                sText.textContent = 'Weak';
                sText.className = 'font-label-sm text-error';
            } else if (val.length >= 8 && !/\d/.test(val)) {
                s1.className = 'h-full w-1/3 bg-[#F59E0B] strength-bar'; // Manual warning color for demo
                s2.className = 'h-full w-1/3 bg-[#F59E0B] strength-bar';
                s3.className = 'h-full w-1/3 bg-surface-container strength-bar';
                sText.textContent = 'Medium';
                sText.className = 'font-label-sm text-[#F59E0B]';
            } else if (val.length >= 8 && /\d/.test(val) && /[a-zA-Z]/.test(val)) {
                s1.className = 'h-full w-1/3 bg-secondary strength-bar';
                s2.className = 'h-full w-1/3 bg-secondary strength-bar';
                s3.className = 'h-full w-1/3 bg-secondary strength-bar';
                sText.textContent = 'Strong';
                sText.className = 'font-label-sm text-secondary';
            }
        });
    </script>
    <!-- Supabase JS (required before main.js module) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/main.js"></script>
</body></html>
