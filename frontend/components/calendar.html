<style>
        body { background-color: #F7F7F2; }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
<!-- Calendar Component Container -->
<div class="bg-white rounded-lg border border-tp-gray-border shadow-[0px_2px_4px_rgba(23,32,51,0.04)] w-full max-w-md overflow-hidden">
<!-- Header -->
<div class="p-md border-b border-tp-gray-border flex items-center justify-between">
<h2 aria-live="polite" class="font-headline-md text-headline-md text-tp-navy" id="calendar-month-year">August 2026</h2>
<div class="flex items-center space-x-1">
<button aria-label="Previous month" class="w-8 h-8 flex items-center justify-center rounded border border-tp-gray-border text-tp-navy hover:text-tp-forest hover:border-tp-forest transition-colors focus:outline-none focus:ring-2 focus:ring-tp-forest focus:ring-opacity-50" onclick="prevMonth()">
<span class="material-symbols-outlined text-sm">chevron_left</span>
</button>
<button aria-label="Today" class="px-3 h-8 flex items-center justify-center rounded border border-tp-gray-border font-label-sm text-label-sm text-tp-navy hover:text-tp-forest hover:border-tp-forest transition-colors focus:outline-none focus:ring-2 focus:ring-tp-forest focus:ring-opacity-50" onclick="goToToday()">
                    Today
                </button>
<button aria-label="Next month" class="w-8 h-8 flex items-center justify-center rounded border border-tp-gray-border text-tp-navy hover:text-tp-forest hover:border-tp-forest transition-colors focus:outline-none focus:ring-2 focus:ring-tp-forest focus:ring-opacity-50" onclick="nextMonth()">
<span class="material-symbols-outlined text-sm">chevron_right</span>
</button>
</div>
</div>
<!-- Grid Days -->
<div class="px-md pt-sm pb-2 grid grid-cols-7 gap-1 text-center font-label-sm text-label-sm text-on-surface-variant">
<div aria-hidden="true">Mon</div>
<div aria-hidden="true">Tue</div>
<div aria-hidden="true">Wed</div>
<div aria-hidden="true">Thu</div>
<div aria-hidden="true">Fri</div>
<div aria-hidden="true">Sat</div>
<div aria-hidden="true">Sun</div>
</div>
<!-- Calendar Grid -->
<div aria-labelledby="calendar-month-year" class="px-md pb-md grid grid-cols-7 gap-1" id="calendar-grid" role="grid">
<!-- Grid is populated by JS -->
</div>
<!-- Selected Date / Task List Area -->
<div class="bg-surface-container-low border-t border-tp-gray-border p-md">
<div class="flex justify-between items-center mb-sm">
<h3 class="font-label-md text-label-md text-tp-navy" id="selected-date-display">Friday, August 8</h3>
<span class="font-label-sm text-label-sm text-tp-forest bg-tp-soft-green px-2 py-0.5 rounded-full" id="task-count-badge">2 Tasks</span>
</div>
<div class="space-y-2" id="task-list">
<!-- Tasks populated by JS -->
</div>
<div class="hidden text-center py-4" id="empty-state">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-3">No tasks scheduled</p>
<button class="w-full h-11 flex items-center justify-center rounded border border-tp-gray-border text-tp-navy font-label-md text-label-md hover:bg-tp-gray-border/20 transition-colors focus:outline-none focus:ring-2 focus:ring-tp-forest focus:ring-opacity-50">
<span class="material-symbols-outlined mr-2 text-sm">add</span>
                    Add Task
                </button>
</div>
</div>
</div>
<script>
        // Mock Data: Tasks for August 2026
        const mockTasks = {
            "2026-08-08": [
                { time: "09:00 AM", title: "Python Practice" },
                { time: "11:00 AM", title: "Project Documentation" }
            ],
            "2026-08-09": [{ time: "02:00 PM", title: "Team Sync" }],
            "2026-08-11": [
                { time: "10:00 AM", title: "Design Review" },
                { time: "01:00 PM", title: "Client Call" },
                { time: "04:00 PM", title: "Code Deploy" }
            ],
            "2026-08-14": [{ time: "All Day", title: "Company Offsite" }],
            "2026-08-18": [{ time: "09:30 AM", title: "Sprint Planning" }],
            "2026-08-21": [{ time: "11:00 AM", title: "1:1 with Manager" }]
        };

        // State
        let currentDate = new Date(2026, 7, 1); // Start August 2026
        let selectedDate = new Date(2026, 7, 8); // Pre-select Aug 8
        const todayReal = new Date(); // Actual today, but for UI demo we'll pretend it's some date in Aug 2026 if we want, or just leave actual today logic. Let's pretend today is Aug 5, 2026 for demo purposes.
        const demoToday = new Date(2026, 7, 5);

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-month-year').textContent = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            // Adjust to Monday start
            let startDayOfWeek = firstDay.getDay() - 1;
            if (startDayOfWeek === -1) startDayOfWeek = 6; // Sunday becomes 6
            
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            // Previous month days
            for (let i = startDayOfWeek - 1; i >= 0; i--) {
                const dayNum = prevMonthLastDay - i;
                grid.appendChild(createDateCell(year, month - 1, dayNum, true));
            }
            
            // Current month days
            for (let i = 1; i <= lastDay.getDate(); i++) {
                grid.appendChild(createDateCell(year, month, i, false));
            }
            
            // Next month days to fill 6 rows (42 cells total)
            const totalCells = startDayOfWeek + lastDay.getDate();
            let nextMonthDay = 1;
            while (grid.children.length < 42) {
                grid.appendChild(createDateCell(year, month + 1, nextMonthDay++, true));
            }

            updateSelectedDateView();
        }

        function createDateCell(year, month, day, isMuted) {
            // Handle month wrap-around for data keys
            const dateObj = new Date(year, month, day);
            const checkYear = dateObj.getFullYear();
            const checkMonth = dateObj.getMonth();
            const checkDay = dateObj.getDate();
            
            const dateKey = `${checkYear}-${String(checkMonth + 1).padStart(2, '0')}-${String(checkDay).padStart(2, '0')}`;
            const isToday = checkYear === demoToday.getFullYear() && checkMonth === demoToday.getMonth() && checkDay === demoToday.getDate();
            const isSelected = selectedDate && checkYear === selectedDate.getFullYear() && checkMonth === selectedDate.getMonth() && checkDay === selectedDate.getDate();
            const hasTasks = mockTasks[dateKey] && mockTasks[dateKey].length > 0;

            const btn = document.createElement('button');
            btn.className = `w-10 h-10 rounded-full flex flex-col items-center justify-center mx-auto relative transition-colors focus:outline-none focus:ring-2 focus:ring-tp-forest focus:ring-offset-1 font-body-sm text-body-sm`;
            btn.setAttribute('role', 'gridcell');
            btn.setAttribute('aria-label', `${dateKey}`);
            
            if (isMuted) {
                btn.classList.add('text-tp-gray-muted');
                btn.classList.add('hover:bg-gray-50');
            } else {
                btn.classList.add('text-tp-navy');
                if (!isSelected) btn.classList.add('hover:bg-gray-100');
            }

            if (isToday && !isSelected) {
                btn.classList.add('border', 'border-tp-forest', 'text-tp-forest', 'font-bold');
            }

            if (isSelected) {
                btn.classList.add('bg-tp-forest', 'text-white', 'font-bold');
                btn.classList.remove('text-tp-navy', 'text-tp-gray-muted', 'hover:bg-gray-100', 'hover:bg-gray-50');
                btn.setAttribute('aria-selected', 'true');
            } else {
                btn.setAttribute('aria-selected', 'false');
            }

            const daySpan = document.createElement('span');
            daySpan.textContent = day;
            btn.appendChild(daySpan);

            if (hasTasks) {
                const dot = document.createElement('span');
                dot.className = `w-1 h-1 rounded-full absolute bottom-1 ${isSelected ? 'bg-white' : 'bg-tp-forest'}`;
                btn.appendChild(dot);
            }

            btn.onclick = () => {
                selectedDate = dateObj;
                // If clicking muted date, jump to that month
                if (isMuted) {
                    currentDate = new Date(checkYear, checkMonth, 1);
                }
                renderCalendar();
            };

            return btn;
        }

        function updateSelectedDateView() {
            if (!selectedDate) return;
            
            const dateStr = `${dayNames[selectedDate.getDay()]}, ${monthNames[selectedDate.getMonth()]} ${selectedDate.getDate()}`;
            document.getElementById('selected-date-display').textContent = dateStr;

            const dateKey = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`;
            const tasks = mockTasks[dateKey] || [];
            
            const badge = document.getElementById('task-count-badge');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');

            taskList.innerHTML = '';

            if (tasks.length > 0) {
                badge.textContent = `${tasks.length} Task${tasks.length > 1 ? 's' : ''}`;
                badge.classList.remove('hidden');
                emptyState.classList.add('hidden');
                taskList.classList.remove('hidden');

                tasks.slice(0, 3).forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.className = 'flex items-center justify-between p-2 rounded bg-white border border-tp-gray-border';
                    taskEl.innerHTML = `
                        <div class="flex flex-col">
                            <span class="font-label-sm text-label-sm text-on-surface-variant">${task.time}</span>
                            <span class="font-body-sm text-body-sm text-tp-navy font-medium truncate">${task.title}</span>
                        </div>
                        <button class="text-tp-gray-muted hover:text-tp-forest transition-colors" aria-label="Complete task">
                            <span class="material-symbols-outlined text-[18px]">radio_button_unchecked</span>
                        </button>
                    `;
                    taskList.appendChild(taskEl);
                });
                
                if (tasks.length > 3) {
                     const moreEl = document.createElement('div');
                     moreEl.className = 'text-center font-label-sm text-label-sm text-tp-forest cursor-pointer hover:underline py-1';
                     moreEl.textContent = `+ ${tasks.length - 3} more`;
                     taskList.appendChild(moreEl);
                }
            } else {
                badge.classList.add('hidden');
                taskList.classList.add('hidden');
                emptyState.classList.remove('hidden');
            }
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date(demoToday.getFullYear(), demoToday.getMonth(), 1);
            selectedDate = new Date(demoToday);
            renderCalendar();
        }

        // Init
        renderCalendar();
    </script>
</body></html>
